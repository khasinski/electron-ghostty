name: ci
on: [push, pull_request]
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.1 }
      - name: libghostty at the pinned commit
        run: |
          git clone https://github.com/ghostty-org/ghostty vendor/ghostty
          git -C vendor/ghostty checkout "$(cat vendor/PINNED_COMMIT)"
      - run: npm install --ignore-scripts     # the install script would run node-gyp before libghostty exists
      - run: ZIG=$(which zig) npm run build:native
      - run: npm test            # native core: PTY, VT, key/mouse encoding (no GUI)
      - name: prebuild artifact
        run: tar czf prebuild-${{ matrix.os }}.tgz build/Release/ghostty_native.node
      - uses: actions/upload-artifact@v4
        with: { name: "prebuild-${{ matrix.os }}", path: "prebuild-*.tgz" }
